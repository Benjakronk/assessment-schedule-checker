<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vurderingskalender: Runni ungdomsskole</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Loading overlay -->
  <div id="overlay" class="overlay" role="status" aria-live="polite">
    <div class="overlay-inner">
      <div class="spinner"></div>
      <p class="overlay-text">Laster...</p>
    </div>
  </div>

  <!-- Detail panel backdrop -->
  <!-- Class selection modal -->
  <div id="classModalOverlay" class="class-modal-overlay"></div>
  <div id="classModal" class="class-modal" role="dialog" aria-modal="true" aria-labelledby="classModalTitle">
    <div class="class-modal-header">
      <h2 id="classModalTitle" class="class-modal-title">Velg din klasse</h2>
      <button id="classModalClose" class="panel-close" aria-label="Lukk">&times;</button>
    </div>
    <div id="classModalGrid" class="class-modal-grid"></div>
    <div class="class-modal-actions">
      <button id="classModalAll" class="btn btn-ghost">Vis alle klasser</button>
      <button id="classModalConfirm" class="btn btn-primary" disabled>Bekreft</button>
    </div>
  </div>

  <div id="panelOverlay" class="panel-overlay" aria-hidden="true"></div>

  <!-- Day detail panel -->
  <aside id="detailPanel" class="detail-panel" aria-label="Vurderingsdetaljer">
    <button id="panelClose" class="panel-close" aria-label="Lukk panel">&times;</button>
    <h2 id="panelTitle" class="panel-title"></h2>
    <div id="panelBody" class="panel-body"></div>
  </aside>

  <div class="page">
    <header class="site-header">
      <div class="site-header-inner">
        <h1 class="site-title">Vurderingskalender</h1>
        <p class="site-subtitle">Runni ungdomsskole</p>
      </div>
    </header>

    <main class="main">
      <div class="controls">
        <div class="control-search">
          <label for="classSearch" class="sr-only">Filtrer klasse</label>
          <input
            type="text"
            id="classSearch"
            class="input"
            placeholder="Filtrer klasse (f.eks. 9A)…"
            autocomplete="off"
          >
        </div>
        <div class="control-dates">
          <label class="date-label">
            Fra
            <input type="date" id="startDate" class="input input-date">
          </label>
          <label class="date-label">
            Til
            <input type="date" id="endDate" class="input input-date">
          </label>
        </div>
        <button id="refreshBtn" class="btn btn-ghost" title="Tving ny henting fra server">
          &#8635; Oppdater
        </button>
      </div>

      <div id="calendar" class="calendar"></div>
    </main>

    <footer class="site-footer">
      <p id="lastUpdated" class="last-updated"></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
