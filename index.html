<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vurderingskalender: Runni ungdomsskole</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <meta name="theme-color" content="#2563eb">
</head>
<body>

  <!-- Loading overlay -->
  <div id="overlay" class="overlay" role="status" aria-live="polite">
    <div class="overlay-inner">
      <div class="spinner"></div>
      <p class="overlay-text">Laster...</p>
    </div>
  </div>

  <!-- Detail panel backdrop -->
  <!-- Class selection modal -->
  <div id="classModalOverlay" class="class-modal-overlay"></div>
  <div id="classModal" class="class-modal" role="dialog" aria-modal="true" aria-labelledby="classModalTitle">
    <div class="class-modal-header">
      <h2 id="classModalTitle" class="class-modal-title">Velg klasse(r)</h2>
      <button id="classModalClose" class="panel-close" aria-label="Lukk">&times;</button>
    </div>
    <p class="class-modal-hint">Du kan velge én eller flere klasser.</p>
    <div id="classModalGrid" class="class-modal-grid"></div>
    <div class="class-modal-actions">
      <button id="classModalAll" class="btn btn-ghost">Vis alle klasser</button>
      <button id="classModalConfirm" class="btn btn-primary" disabled>Bekreft</button>
    </div>
  </div>

  <div id="panelOverlay" class="panel-overlay" aria-hidden="true"></div>

  <!-- Day detail panel -->
  <aside id="detailPanel" class="detail-panel" aria-label="Vurderingsdetaljer">
    <button id="panelClose" class="panel-close" aria-label="Lukk panel">&times;</button>
    <h2 id="panelTitle" class="panel-title"></h2>
    <div id="panelBody" class="panel-body"></div>
  </aside>

  <div class="page">
    <header class="site-header">
      <div class="site-header-inner">
        <h1 class="site-title">Vurderingskalender</h1>
        <p class="site-subtitle">Runni ungdomsskole</p>
      </div>
    </header>

    <main class="main">
      <div class="controls" id="controls">
        <!-- Mobile-only quickbar; toggles the controls body -->
        <div class="controls-quickbar">
          <button id="toolbarToggle" class="toolbar-toggle" type="button" aria-expanded="false" aria-controls="controlsBody">
            <span class="chevron" aria-hidden="true">▾</span>
            <span class="toolbar-toggle-label">Filter</span>
            <span id="toolbarSummary" class="toolbar-summary"></span>
          </button>
        </div>

        <div id="controlsBody" class="controls-body">
          <div class="control-section" data-section="classes">
            <span class="control-label control-label-desktop">Klasse</span>
            <button class="section-toggle" type="button" aria-expanded="false">
              <span class="section-label">Klasse</span>
              <span class="section-summary" id="classSummary"></span>
              <span class="chevron" aria-hidden="true">▾</span>
            </button>
            <div class="section-body">
              <div id="classFilterBtns" class="class-filter-btns"></div>
              <button id="clearClassesBtn" class="btn btn-ghost btn-tiny" hidden>Tøm</button>
            </div>
          </div>

          <div class="control-section" data-section="dates">
            <button class="section-toggle" type="button" aria-expanded="false">
              <span class="section-label">Dato</span>
              <span class="section-summary" id="dateSummary"></span>
              <span class="chevron" aria-hidden="true">▾</span>
            </button>
            <div class="section-body control-dates">
              <label class="date-label">
                Fra
                <input type="date" id="startDate" class="input input-date">
              </label>
              <label class="date-label">
                Til
                <input type="date" id="endDate" class="input input-date">
              </label>
            </div>
          </div>

          <div class="controls-actions">
            <button id="jumpTodayBtn" class="btn btn-ghost" title="Bla til i dag">I dag</button>
            <button id="refreshBtn" class="btn btn-ghost" title="Hent ferske data fra server">
              &#8635; Oppdater
            </button>
            <span id="bgLoading" class="bg-loading" role="status" aria-live="polite">
              <span class="mini-spinner"></span>
              <span class="bg-loading-text">Oppdaterer…</span>
            </span>
          </div>
        </div>
      </div>

      <div id="calendar" class="calendar"></div>
    </main>

    <footer class="site-footer">
      <p id="lastUpdated" class="last-updated"></p>
      <p class="copyright">Copyright Benjamin Ensrud 2026</p>
    </footer>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span class="toast-msg"></span>
    <button type="button" class="toast-action" hidden></button>
  </div>

  <script src="script.js"></script>
</body>
</html>
